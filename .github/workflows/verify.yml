name: verify
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: ao3575911/botproof, ref: 8b76983a9d10b869c54e394f49fedb1e02ff573f, path: .cli, persist-credentials: false } # v0.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: cd .cli && npm ci && npm run build
      - name: Check signatures, ownership and live proofs
        run: |
          if [ -n "$BASE_SHA" ]; then
            node .cli/dist/src/cli.js registry check . --base "$BASE_SHA" --author "$AUTHOR"
          else
            node .cli/dist/src/cli.js registry check .
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
